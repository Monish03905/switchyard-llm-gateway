name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint + tests + cockpit build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-postgres.txt
            requirements-dev.txt

      - name: Install Python dependencies
        run: pip install -r requirements-postgres.txt -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        env:
          APP_ENV: test
        run: pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install cockpit dependencies
        working-directory: web
        run: npm ci

      - name: Typecheck and build cockpit
        working-directory: web
        run: npm run build

  eval-gate:
    name: policy gate (simulated gauntlet)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-postgres.txt

      - name: Install runtime dependencies
        run: pip install -r requirements-postgres.txt

      # Runs 36 tasks x 3 policies against the deterministic simulator and
      # fails if prime < 95%, router < 90%, or router saves < 10% vs prime.
      - name: Run evals
        run: python scripts/policy_gate.py

  docker:
    name: docker image + health probe
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t switchyard:ci .

      - name: Boot the container and wait for /health
        run: |
          docker run -d --name yard -p 8000:8000 switchyard:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then
              echo
              echo "healthy after ${attempt} attempt(s)"
              docker rm -f yard
              exit 0
            fi
            sleep 2
          done
          echo "container never became healthy"
          docker logs yard
          docker rm -f yard
          exit 1
