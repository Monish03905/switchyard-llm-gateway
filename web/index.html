<!doctype html>
<html lang="en" data-theme="paper">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Switchyard is an LLM gateway with explainable routing, failover, hash-chained receipts and a three-policy exam that proves the savings."
    />
    <meta name="theme-color" content="#F1EADB" />
    <title>Switchyard — one gate, many engines</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        var fromUrl = new URLSearchParams(window.location.search).get("theme");
        var saved = localStorage.getItem("switchyard-theme");
        var theme = fromUrl || saved;
        if (theme === "paper" || theme === "dusk" || theme === "blueprint") {
          document.documentElement.dataset.theme = theme;
        }
      } catch (error) {
        /* a private browser can still use the default theme */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
